site_name: PHAxis 1.0.0
site_description: Calibrated primary-root and root-hair phenotyping
theme:
  name: material
  features: [navigation.sections, content.code.copy]
plugins: [search]
nav:
  - Home: index.md
  - Installation: installation.md
  - Tutorial: tutorial.md
  - Input contract: inputs.md
  - Output contract: outputs.md
  - CLI: cli.md
  - Methods: methods.md
  - Research assets: research-assets.md
  - Troubleshooting: faq.md
