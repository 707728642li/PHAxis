name: PyPI OIDC template - disabled for local preparation
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  publish:
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: https://test.pypi.org/legacy/
      # Owner must configure a TestPyPI Trusted Publisher and review exact artifacts
      # before removing the hard false condition. Production PyPI is a separate approval.
