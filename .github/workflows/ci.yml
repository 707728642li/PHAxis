name: CPU contracts and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test,dev,build]"
      - run: python -m ruff check src scripts/check_cpu.py scripts/check_links.py
      - run: python -m ruff format --check src/phaxis/local_demo.py src/phaxis/offline_report.py tests/release scripts/check_cpu.py scripts/check_links.py
      - run: python -m mypy
      - run: python scripts/check_cpu.py
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: phaxis demo --output demo-results
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: docker build -f containers/Dockerfile -t phaxis:1.0.0-local .
      - run: docker run --rm phaxis:1.0.0-local demo --output /tmp/phaxis-demo
